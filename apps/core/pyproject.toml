[project]
name = "heren-core"
version = "0.1.0"
description = "Heren Agent core server: event bus, character engine, Hermes bridge, Action API, device gateway"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "aiosqlite>=0.20",
    "websockets>=13",
    "pynacl>=1.5",
    "httpx>=0.27",
    "pyyaml>=6",
    "mcp>=1.10",
    "httpx-sse>=0.4",
    "segno>=1.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["heren_core*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
